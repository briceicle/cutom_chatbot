version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: "build"
          command: "echo build"
  no-op:
    type: no-op
  serial-start:
    key: << pipeline.project.slug >>/build
    type: lock
  serial-end:
    key: << pipeline.project.slug >>/build
    type: unlock

workflows:
  workflow:
    when: pipeline.git.branch matches /^(?!sneaky).*/
    jobs:
      - no-op
      - build:
          requires:
              - no-op
