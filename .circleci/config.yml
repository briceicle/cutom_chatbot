version: 2.1
workflows:
  gha:
    jobs:
      - prepare
      - build:
          requires:
            - prepare
      - test:
          requires:
            - prepare
      - log-behavior
      - report:
          requires:
            - build
            - test
jobs:
  prepare:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: prepare
          environment:
            RUNNER_JOB_PAYLOAD: 
            RUNNER_RESULTS_DIR: /tmp/gha-results
          command: circleci run actions exec --job-source=env
  build:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: build
          environment:
            RUNNER_JOB_PAYLOAD: 
            RUNNER_RESULTS_DIR: /tmp/gha-results
          command: circleci run actions exec --job-source=env
  test:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: test
          environment:
            RUNNER_JOB_PAYLOAD: 
            RUNNER_RESULTS_DIR: /tmp/gha-results
          command: circleci run actions exec --job-source=env
  log-behavior:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: log-behavior
          environment:
            RUNNER_JOB_PAYLOAD: 
            RUNNER_RESULTS_DIR: /tmp/gha-results
          command: circleci run actions exec --job-source=env
  report:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: report
          environment:
            RUNNER_JOB_PAYLOAD: 
            RUNNER_RESULTS_DIR: /tmp/gha-results
          command: circleci run actions exec --job-source=env
