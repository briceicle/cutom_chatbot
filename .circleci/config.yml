version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: "Build"
          command: "echo build"
  test:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: "Test"
          command: "echo test"
  cleanup:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: "Cleanup"
          command: "echo cleaning up resources"

workflows:
  workflow:
    jobs:
      - build
      - test:
          requires: 
            - build: failed
      - cleanup:
          requires: 
            - build: not_run
