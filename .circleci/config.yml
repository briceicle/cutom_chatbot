version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:current
    parameters:
      word:
        type: string
    steps:
      - run:
          name: "build"
          command: "echo << parameters.word >> world"
  test:
    type: no-op

workflows:
  workflow:
    jobs:
      - build:
          matrix:
            parameters:
              word: ["hello", "goodbye" ]
     - test:
         requires: build
