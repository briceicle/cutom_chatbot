version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: "build"
          command: "exit 1"
  no-op:
    type: no-op
  serial-start:
    key: << pipeline.project.slug >>/build
    type: lock
  serial-end:
    key: << pipeline.project.slug >>/build
    type: unlock

workflows:
  workflow:
    jobs:
      - serial-start
      - no-op:
          requires:
              - serial-start
      - build:
          requires:
              - no-op
      - serial-end:
          requires:
              - build: terminal
