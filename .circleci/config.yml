version: 2.1

parameters:
  job_type:
    type: string
    default: build

jobs:
  build:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run: echo "hello"

  maybe:
    type: << pipeline.parameters.job_type >>
    docker:
      - image: cimg/base:current
    steps:
      - run: echo "maybe"

  notify:
    docker:
      - image: cimg/base:current
    steps:
      - run: echo "notify"

workflows:
  main:
    jobs:
      - build
      - maybe
      - notify
