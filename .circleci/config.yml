version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: "build"
          command: "echo build"
  test:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: "test"
          command: "sleep 1m"
  no-op:
    type: no-op

job-groups:
  build-and-test:
    jobs:
      - build
      - test:
          requires:
              - build

workflows:
  workflow:
    jobs:
      - no-op:
          name: start
      - build-and-test:
          serial-group: << pipeline.project.slug >>/build-and-test
          requires:
              - start
      - no-op:
          name: end
          requires:
              - build-and-test
