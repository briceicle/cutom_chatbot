version: 2.1

jobs:
  setup:
    docker:
      - image: cimg/base:current
    steps:
      - run: echo setup
  build:
    docker:
      - image: cimg/base:current
    steps:
      - run: echo build

workflows:
  main:
    jobs:
      - setup
      - build:
          requires:
            - setup
          upstream:
            setup:
              - success
