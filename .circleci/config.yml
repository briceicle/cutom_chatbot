version: 2.1

parameters:
  my-param:
    type: boolean
    default: false

jobs:
  build:
    docker:
      - image: alpine
    steps:
      - run: exit 0

workflows:
  guarded:
    when:
      and:
        - << pipeline.parameters.my-param >>
        - matches:
            pattern: "^(?!I AM SNEAKING INTO IT).*"
            value: arbitrary value
    jobs:
      - build
