version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: "build"
          command: "echo hello"
  no-op:
    type: no-op

job-groups:
  my-job-group:
    jobs:
      - no-op:
          name: my-no-op
      - build:
          requires:
              - my-no-op

workflows:
  workflow:
    jobs:
      - my-job-group
